[package]
name = "waterwaymaporg_river"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "wwm-river"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
minijinja = { version = "2.24.0", features = ["loader"] }
rayon = "1.12.0"

libsqlitesite = "0.2.0"
serde = "1.0.229"
serde_json = "1.0.151"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.16"
indicatif = "0.18.6"
walkdir = "2.5.0"
env_logger = "0.11.11"
log = "0.4.34"
num-format = "0.4.4"
zstd = "0.13.3"
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
itertools = "0.14.0"
ordered-float = "5.5.0"
